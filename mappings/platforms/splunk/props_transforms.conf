# Lokryn Compliance Log - Splunk Configuration
# Copy relevant sections to your props.conf and transforms.conf

# =============================================================================
# props.conf
# =============================================================================

[lokryn:compliance:log]
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TIME_PREFIX = "time":"
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 0
KV_MODE = json

# Field aliases for CIM compliance
FIELDALIAS-user = actor_id AS user
FIELDALIAS-app = component AS app
FIELDALIAS-signature = message AS signature
FIELDALIAS-object = resource AS object
FIELDALIAS-src = client_id AS src
FIELDALIAS-dest = server_id AS dest

# Calculated fields
EVAL-action = case(outcome==1, "success", outcome>=2 AND outcome<=4, "failure", 1==1, "unknown")
EVAL-severity = case(severity<=2, "debug", severity<=4, "informational", severity==5, "medium", severity>=6, "high")
EVAL-duration = duration_ms / 1000

# =============================================================================
# transforms.conf
# =============================================================================

[lokryn_extract_genai]
REGEX = "genai":\s*\{([^}]+)\}
FORMAT = genai_payload::$1

[lokryn_extract_mcp]
REGEX = "mcp":\s*\{([^}]+)\}
FORMAT = mcp_payload::$1

# =============================================================================
# eventtypes.conf
# =============================================================================

[lokryn_authentication]
search = sourcetype="lokryn:compliance:log" (event_type=1 OR event_type=2)

[lokryn_file_access]
search = sourcetype="lokryn:compliance:log" event_type=3

[lokryn_change]
search = sourcetype="lokryn:compliance:log" (event_type=4 OR event_type=6 OR event_type=11)

[lokryn_network]
search = sourcetype="lokryn:compliance:log" (event_type=8 OR event_type>=40)

[lokryn_process]
search = sourcetype="lokryn:compliance:log" (event_type=9 OR event_type=10)

[lokryn_ai_agent]
search = sourcetype="lokryn:compliance:log" (event_type>=20 AND event_type<=26)

[lokryn_mcp]
search = sourcetype="lokryn:compliance:log" (event_type>=30 AND event_type<=42)

# =============================================================================
# tags.conf
# =============================================================================

[eventtype=lokryn_authentication]
authentication = enabled

[eventtype=lokryn_file_access]
data = enabled
access = enabled

[eventtype=lokryn_change]
change = enabled
audit = enabled

[eventtype=lokryn_network]
network = enabled
communicate = enabled

[eventtype=lokryn_process]
process = enabled
report = enabled

[eventtype=lokryn_ai_agent]
web = enabled

[eventtype=lokryn_mcp]
web = enabled
